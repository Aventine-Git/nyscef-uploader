name: Test & Deploy

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # rsync writes every file through a temp file in its parent directory, so a deploy tree
      # the deploy user cannot own or write fails ~80 times with "mkstemp: Permission denied"
      # and "failed to set times" — which reads like an rsync flag problem rather than a
      # permissions one. Check up front and print the repair command instead.
      #
      # The identity lines are printed on every run, pass or fail: the 2026-09 failure looked
      # like plain ownership drift, but checking by hand over `ssh server` showed the tree
      # owned by cat and writable. A laptop's ssh config and CI's DEPLOY_USER/DEPLOY_HOST
      # secrets can resolve to different users, and the router's port-forward to a different
      # host, so only CI can say who it actually was.
      - name: Verify deploy directory is writable by the deploy user
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            dir=/opt/nyscef-uploader
            me=$(id -un)

            echo "deploy identity: host=$(hostname) user=$me uid=$(id -u)"

            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist on $(hostname). On the server run: sudo mkdir -p $dir && sudo chown $me:$me $dir"
              exit 1
            fi

            echo "deploy target: $dir owner=$(stat -c '%U:%G' "$dir") mode=$(stat -c '%a' "$dir") ctime=$(stat -c '%z' "$dir")"

            foreign=$(find "$dir" -not -user "$me" -print -quit 2>/dev/null || true)
            if [ -n "$foreign" ]; then
              echo "::error::$dir is not fully owned by $me on $(hostname) — $(stat -c '%U' "$foreign") owns $foreign. On the server run: sudo chown -R $me:$me $dir"
              exit 1
            fi

            # Prove writability by making rsync's exact syscall rather than trusting the mode
            # bits: `test -w` is satisfied by an immutable attribute, a read-only remount, a
            # restrictive ACL or a full disk, all of which still fail mkstemp.
            if probe=$(mktemp "$dir/.deploy-probe.XXXXXX" 2>&1); then
              rm -f "$probe"
              echo "write probe: ok"
            else
              echo "::error::cannot create a file in $dir as $me on $(hostname): $probe"
              exit 1
            fi

      - name: Sync files to server
        run: |
          sshpass -e rsync -az --delete --omit-dir-times \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='dist' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/nyscef-uploader/
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}

      - name: Write .env, build, and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd /opt/nyscef-uploader

            cat > .env <<EOF
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            NYSCEF_QUEUE_URL=${{ secrets.NYSCEF_QUEUE_URL }}
            CF_INJECT_COOKIE=true
            NOTIFY_RECIPIENTS=${{ secrets.NOTIFY_RECIPIENTS }}
            NOTIFY_SLACK_RECIPIENTS=${{ secrets.NOTIFY_SLACK_RECIPIENTS }}
            WARM_START_LOGIN=false
            EOF

            chmod 600 .env
            docker compose up --build -d
            echo "Deploy complete."
